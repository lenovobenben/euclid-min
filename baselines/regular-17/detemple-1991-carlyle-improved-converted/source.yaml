  conversion_notes: >-
    The x- and y-axes are constructed and charged. Both modifications stated
    on page 104 are used: the half-scaled Carlyle circle replaces the double
    bisection, and the circle from step (vi) is reused to bisect OY. Because
    the half-scaled circle directly locates the two centers needed by step
    (v), the superseded full-scale root branch from steps (ii)-(iii) is
    removed. A project-local exact-incidence shortcut replaces the first
    distance transfer with one circle through Y; a project-local exact
    three-line window then locates the final Carlyle center. The final unit
    transfer is replaced by the perpendicular bisector of OH0,8, whose
    intersections with the unit circle are the two targets. Only either
    adjacent vertex of A is required.
